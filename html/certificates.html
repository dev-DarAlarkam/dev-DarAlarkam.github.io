<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>شهادات الحفظ | دار الأرقم</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/certificates.css">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/form.js" defer></script>
    <script src="js/certificate.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/Amiri-Bold.js" defer></script>
    <script src="js/images.js" defer></script>
</head>
<body style="background-image: url('assets/images/pattern.svg');">
    <header><nav><h1>أدوات مربو دار الأرقم</h1><a class="home-link" href="index.html">الرئيسية</a></nav></header>
    <main><section class="section"><div class="container">
        <a class="back-button" href="index.html"><div class="back-arrow"></div><span>العودة للقائمة الرئيسية</span></a>
        <h2>إنشاء شهادة حفظ</h2>
        <div class="form-container"><form id="certificate-form">
            <div class="form-group"><label for="student-name">اسم الطالب:</label><input type="text" id="student-name" name="studentName" required></div>
            <div class="form-group"><label for="gender">طالب أم طالبة؟</label><div class="radio-group">
                <label class="custom-radio"><input id="male" onclick="handleClick(this);" type="radio" name="gender" value="cert-male" checked><span class="radio-mark"></span>طالب</label>
                <label class="custom-radio"><input id="female" onclick="handleClick(this);" type="radio" name="gender" value="cert-female"><span class="radio-mark"></span>طالبة</label>
            </div></div>
            <div class="form-group"><label for="certificate-type">نوع الشهادة:</label><select id="certificate-type" name="certificateType" required>
                <option value="">اختر نوع الشهادة</option><option value="1">حفظ جزء</option><option value="5">حفظ 5 أجزاء</option><option value="10">حفظ 10 أجزاء</option><option value="15">حفظ 15 أجزاء</option><option value="20">حفظ 20 أجزاء</option><option value="25">حفظ 25 أجزاء</option>
            </select></div>
            <div id="dynamic-fields"></div><div class="sized-box"></div>
            <button type="button" onclick="generatePreview()">معاينة الشهادة</button>
            <button type="button" onclick="exportAsPDF()" id="pdf-button" disabled>تحميل PDF</button>
            <button type="button" onclick="exportAsPNG()" id="png-button" disabled>تحميل PNG</button>
        </form><div id="message"></div></div>
        <div id="certificate-preview" class="certificate-container"></div>
    </div></section></main>
    <footer><p>&copy; <strong id="year-display"></strong> <a href="https://www.facebook.com/dar9alarkam" target="_blank" rel="noopener">دار الأرقم</a>. جميع الحقوق محفوظة.</p></footer>
</body>
</html>
